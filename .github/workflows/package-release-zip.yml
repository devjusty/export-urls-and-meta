name: Package release zip

on:
  release:
    types:
      - published

jobs:
  build-zip:
    name: Build installable zip
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip

      - name: Build installable zip
        run: php bin/package-plugin.php --output=/tmp/export-urls-and-meta.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/export-urls-and-meta.zip
