name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './plugin-update-checker/*' \
            -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check assets/js/export-urls-and-meta.js

      - name: PHP_CodeSniffer (WPCS)
        run: composer phpcs

      - name: PHPUnit
        run: composer test
